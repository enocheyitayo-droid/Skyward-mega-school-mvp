[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "24"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["pg", "@netlify/database"]

# Explicit registration also supports projects linked through the Netlify API.
[[plugins]]
  package = "@netlify/plugin-nextjs"
